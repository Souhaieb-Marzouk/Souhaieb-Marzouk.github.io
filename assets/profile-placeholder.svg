<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#11192a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(0,255,136,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,255,136,0)"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,255,136,0.08)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="240" height="240" fill="url(#bg)"/>
  <rect width="240" height="240" fill="url(#grid)"/>
  <rect width="240" height="240" fill="url(#glow)"/>

  <!-- corner brackets -->
  <g stroke="#00ff88" stroke-width="2" fill="none">
    <path d="M 4 24 L 4 4 L 24 4"/>
    <path d="M 216 4 L 236 4 L 236 24"/>
    <path d="M 4 216 L 4 236 L 24 236"/>
    <path d="M 216 236 L 236 236 L 236 216"/>
  </g>

  <!-- silhouetted figure -->
  <g transform="translate(120, 100)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="28" fill="rgba(0,255,136,0.12)" stroke="#00ff88" stroke-width="1.2"/>
    <path d="M -50 90 Q -50 50 0 50 Q 50 50 50 90 L 50 100 L -50 100 Z" fill="rgba(0,224,255,0.18)" stroke="#00e0ff" stroke-width="1.5"/>
    <!-- scanline across figure -->
    <rect x="-30" y="-5" width="60" height="10" fill="rgba(0,255,136,0.35)"/>
  </g>

  <text x="120" y="200" font-family="'SFMono-Regular', monospace" font-size="11" text-anchor="middle" fill="#00ff88" letter-spacing="2">PROFILE.DAT</text>
  <text x="120" y="216" font-family="'SFMono-Regular', monospace" font-size="9" text-anchor="middle" fill="#4a6678" letter-spacing="1">// REPLACE WITH YOUR PHOTO</text>

  <!-- scanline -->
  <rect x="0" y="80" width="240" height="2" fill="rgba(0,255,136,0.5)">
    <animate attributeName="y" from="0" to="240" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
